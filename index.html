<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广告学习中心</title>
<meta name="description" content="Google Ads 与 Meta Ads 系统视频教程：投放前准备、后台操作、广告结构搭建、素材测试与日常优化，36 个视频按平台分区。">
<style>
  :root {
    --accent: #334155;
    --accent-strong: #1e293b;
    --accent-soft: #eef1f5;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1e24;
    --text-dim: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --accent: #94a3b8;
    --accent-strong: #cbd5e1;
    --accent-soft: #1f242c;
    --bg: #111418;
    --card: #191d24;
    --text: #e9edf2;
    --text-dim: #9aa3b0;
    --border: #2a2f38;
    --border-strong: #3a414d;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  /* 顶部栏 */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; white-space: nowrap; }
  .logo .logo-mark { width: 24px; height: 24px; flex-shrink: 0; }
  .spacer { flex: 1; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-dim);
    border-radius: 9px; cursor: pointer; transition: color .2s, border-color .2s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  [data-theme="light"] .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: none; }

  /* 姊妹站点互跳 */
  .site-link {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-dim);
    border-radius: 999px; font-size: 13px; font-weight: 600;
    text-decoration: none; white-space: nowrap;
    transition: color .18s, border-color .18s;
  }
  .site-link:hover { color: var(--text); border-color: var(--border-strong); }
  .site-link .site-link-mark { font-size: 14px; line-height: 1; }
  .site-link svg { transition: transform .18s; flex-shrink: 0; }
  .site-link:hover svg { transform: translateX(2px); }

  /* Hero */
  .hero {
    max-width: 1080px; margin: 0 auto; padding: 64px 24px 12px;
    text-align: center;
  }
  .hero .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent-strong);
    background: var(--accent-soft); border-radius: 999px; padding: 4px 14px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15;
    margin: 0 0 16px;
  }
  .hero p { color: var(--text-dim); font-size: 16px; max-width: 640px; margin: 0 auto; }
  .hero .count {
    margin-top: 22px; font-size: 13px; color: var(--text-dim);
  }

  /* 平台切换 */
  .tabs {
    max-width: 1080px; margin: 34px auto 0; padding: 0 24px;
    display: flex; gap: 9px; flex-wrap: wrap; justify-content: center;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-dim);
    border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: color .18s, border-color .18s, background .18s;
  }
  .tab:hover { border-color: var(--border-strong); color: var(--text); }
  .tab[aria-selected="true"] {
    background: var(--tab-color, var(--accent));
    border-color: var(--tab-color, var(--accent));
    color: #fff;
  }
  .tab-count {
    font-size: 11.5px; font-weight: 700; line-height: 1.6;
    background: var(--accent-soft); color: var(--text-dim);
    border-radius: 999px; padding: 0 7px;
    font-variant-numeric: tabular-nums;
  }
  .tab[aria-selected="true"] .tab-count { background: rgba(255,255,255,.24); color: #fff; }

  /* 分组标题 */
  .group-label {
    max-width: 1080px; margin: 40px auto 0; padding: 0 24px;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .group-label .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--panel-color, var(--accent));
  }
  .group-label span { color: var(--accent-strong); }

  /* 卡片网格 */
  .grid {
    max-width: 1080px; margin: 0 auto; padding: 18px 24px 6px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 14px;
  }
  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; width: 100%;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); }
  .card:focus-visible { outline: 2px solid var(--c, var(--accent)); outline-offset: 2px; }
  .card-num {
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 11px; background: var(--c, var(--accent)); color: #fff;
    font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-weight: 700; font-size: 14.5px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-sub { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-top: 2px; }
  .card-play {
    flex-shrink: 0; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid var(--border); color: var(--text-dim);
    transition: color .15s, background .15s, border-color .15s;
  }
  .card:hover .card-play { color: #fff; background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); }

  /* 页脚 */
  .footer {
    max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px;
    text-align: center; color: var(--text-dim); font-size: 13px;
  }
  .footer a { color: var(--text-dim); }

  /* 视频弹窗 */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal.open { display: flex; }
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(8,10,14,.74);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .modal-box {
    position: relative; width: 100%; max-width: 940px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,.42);
  }
  .modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title {
    flex: 1; min-width: 0; font-size: 14.5px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-title .idx { color: var(--text-dim); font-weight: 600; margin-right: 6px; }
  .modal-player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .modal-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  @media (max-width: 700px) {
    .hero { padding: 44px 20px 8px; }
    .hero h1 { font-size: 29px; }
    .tabs { margin-top: 26px; padding: 0 16px; gap: 7px; }
    .tab { padding: 9px 14px; font-size: 13px; }
    .site-link { padding: 7px 11px; }
    .site-link .site-link-label { display: none; }
    .group-label { padding: 0 16px; margin-top: 32px; }
    .grid { padding: 14px 16px 4px; grid-template-columns: 1fr; }
    .modal { padding: 0; align-items: flex-end; }
    .modal-box { max-width: 100%; border-radius: 16px 16px 0 0; border-bottom: 0; }
    .modal-title { font-size: 13px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <img src="avatar.jpg" class="logo-mark" alt="Chris" style="border-radius:50%; object-fit:cover;">
      <span>广告学习中心</span>
    </div>
    <div class="spacer"></div>
    <a class="site-link" href="https://ai.chrisgao1219.com/">
      <span class="site-link-mark">🎓</span>
      <span class="site-link-label">AI 学习中心</span>
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题">
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <span class="eyebrow">广告投放学习路径</span>
    <h1>Google 与 Meta 广告<br>从入门到进阶</h1>
    <p>投放前准备、后台操作、广告结构搭建、素材测试与日常优化——按平台分区，点开即看。</p>
    <div class="count" id="heroCount"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="平台切换"></nav>

  <div id="panels"></div>
</main>

<footer class="footer">
  <a href="https://chrisgao1219.com/">chrisgao1219.com</a> · 广告学习中心
</footer>

<!-- 视频弹窗 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="视频播放">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="icon-btn" id="modalClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-player" id="modalPlayer"></div>
  </div>
</div>

<script src="videos.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 平台配置 ---------- */
  var TABS = [
    { key: 'google', label: 'Google Ads',  color: '#ea4335' },
    { key: 'meta',   label: 'Meta Ads',    color: '#0866ff' }
  ];
  var COLOR = {};
  TABS.forEach(function (t) { COLOR[t.key] = t.color; });

  /* 分组展示顺序与说明 */
  var GROUP_ORDER = {
    google: ['入门必看', '广告结构', 'PMAX 系列', '搜索广告系列', '其他流量', 'B2B 专题'],
    meta:   ['入门必看', '广告结构', '素材策略', '投放技巧']
  };
  var GROUP_DESC = {
    '入门必看':       '投放前先搞懂这些',
    '广告结构':       '测试组 · 扩量组 · 特殊组 · 复购组',
    '素材策略':       '爆款图片与短视频测试',
    '投放技巧':       '日常优化与实用操作',
    'PMAX 系列':      '从基础必建到关键扩量',
    '搜索广告系列':    '三层漏斗逐步打开',
    '其他流量':       'Demand Gen 与购物 Feed',
    'B2B 专题':       '从找客户到系列搭建'
  };
  /* Google 侧有专属说明的分组覆盖 */
  var GROUP_DESC_OVERRIDE = {
    'google': { '广告结构': '全漏斗高转化框架' }
  };

  function groupDesc(platform, group) {
    var ov = GROUP_DESC_OVERRIDE[platform];
    if (ov && ov[group]) return ov[group];
    return GROUP_DESC[group] || '';
  }

  /* ---------- 标题拆解：主标题 + 副标题 ---------- */
  function splitTitle(text) {
    var m = text.match(/^(.*?)[（(]([^（）()]+)[）)]\s*$/);
    if (m) return { main: m[1].trim(), sub: m[2].trim() };
    m = text.match(/^\[([^\]]+)\]\s*(.+)$/);
    if (m) return { main: m[2].trim(), sub: m[1].trim() };
    return { main: text, sub: '' };
  }

  /* ---------- 数据整理 ---------- */
  var DATA = {};
  TABS.forEach(function (t) { DATA[t.key] = []; });
  (typeof VIDEOS !== 'undefined' ? VIDEOS : []).forEach(function (v) {
    if (DATA[v.platform]) DATA[v.platform].push(v);
  });

  /* ---------- 渲染平台切换 ---------- */
  var tabsEl = document.getElementById('tabs');
  var panelsEl = document.getElementById('panels');
  var heroCount = document.getElementById('heroCount');

  var total = 0;
  TABS.forEach(function (t) { total += DATA[t.key].length; });
  heroCount.textContent = '🎬 共 ' + total + ' 个视频 · ' +
    TABS.map(function (t) { return t.label + ' ' + DATA[t.key].length + ' 个'; }).join(' · ');

  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.dataset.platform = t.key;
    b.style.setProperty('--tab-color', t.color);
    b.innerHTML = '<span></span><span class="tab-count">' + DATA[t.key].length + '</span>';
    b.firstChild.textContent = t.label;
    tabsEl.appendChild(b);
  });

  /* ---------- 渲染面板 ---------- */
  TABS.forEach(function (t) {
    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.dataset.platform = t.key;
    panel.style.setProperty('--panel-color', t.color);

    var list = DATA[t.key];
    var groups = {};
    list.forEach(function (v) { (groups[v.group] = groups[v.group] || []).push(v); });

    var order = GROUP_ORDER[t.key] || Object.keys(groups);
    /* 兜底：数据里出现但未列入 order 的分组 */
    Object.keys(groups).forEach(function (g) {
      if (order.indexOf(g) === -1) order.push(g);
    });

    order.forEach(function (g) {
      if (!groups[g] || !groups[g].length) return;

      var label = document.createElement('div');
      label.className = 'group-label';
      var desc = groupDesc(t.key, g);
      label.innerHTML = '<span class="dot"></span><span>' + g + '</span>' +
        (desc ? ' — ' + desc : '');
      panel.appendChild(label);

      var grid = document.createElement('section');
      grid.className = 'grid';
      groups[g].forEach(function (v) {
        grid.appendChild(makeCard(v, t.color));
      });
      panel.appendChild(grid);
    });

    panelsEl.appendChild(panel);
  });

  function makeCard(v, color) {
    var st = splitTitle(v.title);
    var card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    card.style.setProperty('--c', color);
    card.dataset.id = v.id;
    card.dataset.n = v.n;
    card.dataset.title = v.title;

    var num = document.createElement('span');
    num.className = 'card-num';
    num.textContent = v.n;

    var body = document.createElement('span');
    body.className = 'card-body';
    var title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = st.main;
    body.appendChild(title);
    if (st.sub) {
      var sub = document.createElement('span');
      sub.className = 'card-sub';
      sub.textContent = st.sub;
      body.appendChild(sub);
    }

    var play = document.createElement('span');
    play.className = 'card-play';
    play.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.3-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>';

    card.appendChild(num);
    card.appendChild(body);
    card.appendChild(play);
    return card;
  }

  /* ---------- 平台切换逻辑 ---------- */
  function selectPlatform(key) {
    if (!DATA[key]) key = TABS[0].key;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute('aria-selected', String(b.dataset.platform === key));
    });
    Array.prototype.forEach.call(panelsEl.children, function (p) {
      p.style.display = (p.dataset.platform === key) ? '' : 'none';
    });
    try { localStorage.setItem('ads-home-platform', key); } catch (e) {}
  }

  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) selectPlatform(btn.dataset.platform);
  });

  var savedPlatform = null;
  try { savedPlatform = localStorage.getItem('ads-home-platform'); } catch (e) {}
  selectPlatform(savedPlatform || TABS[0].key);

  /* ---------- 视频弹窗（点击才创建 iframe，关闭即销毁） ---------- */
  var modal = document.getElementById('modal');
  var modalPlayer = document.getElementById('modalPlayer');
  var modalTitle = document.getElementById('modalTitle');
  var modalClose = document.getElementById('modalClose');
  var lastFocus = null;

  function openVideo(id, n, title) {
    lastFocus = document.activeElement;
    modalTitle.innerHTML = '<span class="idx">' + n + '</span>';
    modalTitle.appendChild(document.createTextNode(title));

    var frame = document.createElement('iframe');
    frame.src = 'https://drive.google.com/file/d/' + id + '/preview';
    frame.allow = 'autoplay; encrypted-media; picture-in-picture';
    frame.allowFullscreen = true;
    frame.setAttribute('title', title);
    modalPlayer.appendChild(frame);

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }

  function closeVideo() {
    if (!modal.classList.contains('open')) return;
    modal.classList.remove('open');
    modalPlayer.innerHTML = '';   /* 销毁 iframe，停止播放 */
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  panelsEl.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    openVideo(card.dataset.id, card.dataset.n, card.dataset.title);
  });

  modalClose.addEventListener('click', closeVideo);
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeVideo();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeVideo();
  });

  /* ---------- 明暗主题 ---------- */
  var themeToggle = document.getElementById('themeToggle');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('ads-home-theme'); } catch (e) {}
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  themeToggle.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('ads-home-theme', cur); } catch (e) {}
  });
})();
</script>
</body>
</html>
